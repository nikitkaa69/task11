version: 2

sources:
  - name: pagila
    database: airbyte_database
    schema: PAGILA
    freshness:
      warn_after: {count: 12, period: hour}
      error_after: {count: 24, period: hour}
    loaded_at_field: last_update
    tables:
      - name: actor
      - name: address
      - name: category
      - name: city
      - name: country
      - name: customer
      - name: film
      - name: film_actor
      - name: film_category
      - name: inventory
      - name: language
      - name: payment
        loaded_at_field: payment_date        
      - name: rental
        loaded_at_field: rental_date       
      - name: staff
      - name: store